<section id="native-care-controls" class="life-native-care" hidden>
  <h3 class="life-section-title">这台手机的通知</h3>
  <p id="native-care-status" class="life-meta" role="status"></p>
  <p class="life-meta">0.18 Android 支持加密后台接收所有角色的关怀、共同话题与到期提醒，开启后显示常驻通知，锁屏隐藏正文。首次连接只建立基线；不自动标记服务器消息已读。接收在线时，服务器可按已启用的自动关怀设置生成问候，继续遵守概率、额度、暂停和安静时段。系统省电或强制停止可能中断接收，重新打开应用可恢复。</p>
  <div class="life-actions"><button id="native-care-enable" type="button" class="text-button">开启本机通知</button><button id="native-care-disable" type="button" class="text-button">关闭本机通知</button></div>
</section>
